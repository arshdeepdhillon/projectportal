# Application Metadata
spring.application.name=project-portal
# Use the local file-backed database unless another profile is explicitly selected.
spring.profiles.default=dev
# Jackson Formatting & Pretty Print
spring.jackson.serialization.indent-output=true
# Database Connection Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectportal}
spring.datasource.username=${DB_USERNAME:projectportal}
spring.datasource.password=${DB_PASSWORD:projectportal-local}
# Database Migration & Schema Control
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
