name: SonarQube Cloud Scan Job

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    # SonarCloud free plan analyzes only the master branch
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Build and analyze
        run: ./gradlew build sonar --no-daemon
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publish SonarCloud analysis summary
        if: success()
        shell: bash
        run: |
          project_key="$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)"
          if [[ -z "$project_key" ]]; then
            echo "::error::sonar.projectKey is missing from sonar-project.properties"
            exit 1
          fi

          {
            printf '## SonarCloud analysis\n\n'
            printf 'The `sonar` task completed successfully for `%s`.\n\n' "$project_key"
            printf -- '- Commit: [`%s`](%s/%s/commit/%s)\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- Dashboard: [SonarCloud project overview](https://sonarcloud.io/project/overview?id=%s)\n' "$project_key"
          } >> "$GITHUB_STEP_SUMMARY"
