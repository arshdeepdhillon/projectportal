# Agent Contribution Weight: [80%] Agent Generated / [20%] Human Refactored
name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-semgrep:
    uses: ./.github/workflows/job-semgrep.yml

  call-build-and-scan:
    uses: ./.github/workflows/job-build-and-scan.yml