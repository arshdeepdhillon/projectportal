# Agent Contribution Weight: [80%] Agent Generated / [20%] Human Refactored
name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-semgrep:
    uses: ./.github/workflows/job-semgrep.yml

  build-and-scan:
    name: Build and scan container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: docker build --tag projectportal:${{ github.sha }} .

      - name: Scan Gradle dependencies with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          trivy-config: trivy.yaml

      - name: Scan Docker image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'projectportal:${{ github.sha }}'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'