# Agent Contribution Weight: [78%] Agent Generated / [22%] Human Refactored
name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-semgrep:
    uses: ./.github/workflows/job-semgrep.yml
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  call-build-and-scan:
    uses: ./.github/workflows/job-build-and-scan.yml

  call-sonarqube:
    uses: ./.github/workflows/job-sonarqube.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}