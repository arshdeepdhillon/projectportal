services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-projectportal}
      POSTGRES_USER: ${DB_USERNAME:-projectportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-projectportal-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  artifact-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-portal-indexer
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-projectportal}
      DB_USERNAME: ${DB_USERNAME:-projectportal}
      DB_PASSWORD: ${DB_PASSWORD:-projectportal-local}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
