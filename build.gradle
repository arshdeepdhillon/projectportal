plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.AZUL
    }
}

group = 'com.bu'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

sourceSets {
    functionalTest {
        java.srcDirs = ['src/functionaltest/java']
        resources.srcDirs = ['src/functionaltest/resources']
    }
}

tasks.register('functionaltest', Test) {
    description = 'Runs functional tests.'

    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath

    useJUnitPlatform()
}

dependencies {
    // Spring Boot related
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Functional Testing related
    functionalTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    functionalTestCompileOnly 'org.projectlombok:lombok'
    functionalTestAnnotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}

